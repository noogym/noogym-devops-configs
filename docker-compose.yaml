services:
  api-manager:
    build:
      context: ./docker/wso2am
    image: noogym-wso2am:4.7.0-mysql
    container_name: api-manager
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      APIM_HOSTNAME: ${APIM_HOSTNAME:?set APIM_HOSTNAME}
      APIM_ADMIN_USER: ${APIM_ADMIN_USER:?set APIM_ADMIN_USER}
      APIM_ADMIN_PASSWORD: ${APIM_ADMIN_PASSWORD:?set APIM_ADMIN_PASSWORD}
      APIM_ENCRYPTION_KEY: ${APIM_ENCRYPTION_KEY:?set APIM_ENCRYPTION_KEY}
      APIM_MGT_BASE_URL: ${APIM_MGT_BASE_URL:?set APIM_MGT_BASE_URL}
      APIM_GATEWAY_HTTP_URL: ${APIM_GATEWAY_HTTP_URL:?set APIM_GATEWAY_HTTP_URL}
      APIM_GATEWAY_HTTPS_URL: ${APIM_GATEWAY_HTTPS_URL:?set APIM_GATEWAY_HTTPS_URL}
      APIM_GATEWAY_WS_URL: ${APIM_GATEWAY_WS_URL:?set APIM_GATEWAY_WS_URL}
      APIM_GATEWAY_WSS_URL: ${APIM_GATEWAY_WSS_URL:?set APIM_GATEWAY_WSS_URL}
      SHARED_DB_NAME: ${SHARED_DB_NAME:?set SHARED_DB_NAME}
      SHARED_DB_URL: ${SHARED_DB_URL:?set SHARED_DB_URL}
      SHARED_DB_USER: ${SHARED_DB_USER:?set SHARED_DB_USER}
      SHARED_DB_PASSWORD: ${SHARED_DB_PASSWORD:?set SHARED_DB_PASSWORD}
      APIM_DB_NAME: ${APIM_DB_NAME:?set APIM_DB_NAME}
      APIM_DB_URL: ${APIM_DB_URL:?set APIM_DB_URL}
      APIM_DB_USER: ${APIM_DB_USER:?set APIM_DB_USER}
      APIM_DB_PASSWORD: ${APIM_DB_PASSWORD:?set APIM_DB_PASSWORD}
    volumes:
      - ./wso2-config:/home/wso2carbon/wso2-config-volume:ro
      - wso2_repository:/home/wso2carbon/wso2am-4.7.0/repository/deployment/server
    expose:
      - "9443"
      - "8243"
      - "8280"
      - "9099"
    networks:
      - wso2am_network
    healthcheck:
      test: ["CMD-SHELL", "curl -ksf https://localhost:9443/carbon/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s
    restart: unless-stopped

  mgt-proxy:
    build:
      context: ./docker/mgt-proxy
    image: noogym-wso2-mgt-proxy:1.0
    container_name: mgt-proxy
    depends_on:
      api-manager:
        condition: service_healthy
    expose:
      - "8081"
    labels:
      caddy: ${CADDY_MGT_HOST:-gateway.noogym.com}
      caddy.reverse_proxy: "{{upstreams 8081}}"
      caddy_ingress_network: ${CADDY_INGRESS_NETWORK:-coolify}
    networks:
      - wso2am_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/healthz || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  gateway-proxy:
    build:
      context: ./docker/gateway-proxy
    image: noogym-wso2-gateway-proxy:1.0
    container_name: gateway-proxy
    depends_on:
      api-manager:
        condition: service_healthy
    expose:
      - "8080"
    labels:
      caddy: ${CADDY_GATEWAY_HOST:-api-gateway.noogym.com}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy_ingress_network: ${CADDY_INGRESS_NETWORK:-coolify}
    networks:
      - wso2am_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  mysql-db:
    build:
      context: ./docker/mysql
    image: noogym-wso2am-mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      SHARED_DB_NAME: ${SHARED_DB_NAME:?set SHARED_DB_NAME}
      SHARED_DB_USER: ${SHARED_DB_USER:?set SHARED_DB_USER}
      SHARED_DB_PASSWORD: ${SHARED_DB_PASSWORD:?set SHARED_DB_PASSWORD}
      APIM_DB_NAME: ${APIM_DB_NAME:?set APIM_DB_NAME}
      APIM_DB_USER: ${APIM_DB_USER:?set APIM_DB_USER}
      APIM_DB_PASSWORD: ${APIM_DB_PASSWORD:?set APIM_DB_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wso2am_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    expose:
      - "80"
    networks:
      - wso2am_network
    profiles:
      - tools
    restart: unless-stopped

volumes:
  mysql_data:
  wso2_repository:

networks:
  wso2am_network:
    driver: bridge
